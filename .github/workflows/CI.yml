name: Continuous Integration
on:
    push:
        branches: [main]
    pusll_request:
job:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            
            - name: Install Dependencies
              run: pip install -r requirements.tst

            - name: Run Tests
              run: pytest
              